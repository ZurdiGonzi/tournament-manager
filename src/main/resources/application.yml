spring:
  application:
    name: tournament-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tournament_manager?sslmode=prefer&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: tournament-sched-

scryfall:
  base-url: ${SCRYFALL_BASE_URL:https://api.scryfall.com}
  cache-ttl-hours: ${SCRYFALL_CACHE_TTL_HOURS:24}
  rate-limit-ms: ${SCRYFALL_RATE_LIMIT_MS:100}
  user-agent: ${SCRYFALL_USER_AGENT:TournamentManagerBackend/1.0}

tournament:
  scheduler:
    recurring-cron: ${TOURNAMENT_SCHEDULER_CRON:0 0 2 * * *}
