spring:
  application:
    name: tournament-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tournament_manager?prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        prepareThreshold: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: tournament-sched-

app:
  jwt:
    secret: ${JWT_SECRET:TournamentManagerDefaultSuperSecretKeyForStatelessJwt2026!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  external:
    moxfield:
      base-url: ${MOXFIELD_API_URL:https://api2.moxfield.com/v2}
    scryfall:
      base-url: ${SCRYFALL_API_URL:https://api.scryfall.com}

tournament:
  scheduler:
    recurring-cron: ${TOURNAMENT_RECURRING_CRON:0 0 2 * * *}
